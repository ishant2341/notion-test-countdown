<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Next Test Countdown</title>
  <style>
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: transparent;
      color: #111;
    }
    .card {
      padding: 14px 16px;
      border-radius: 14px;
      background: #f6f6f6;
      display: inline-block;
      min-width: 260px;
    }
    .label {
      font-size: 12px;
      opacity: 0.75;
      margin-bottom: 6px;
    }
    .date {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .time {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .small {
      font-size: 12px;
      opacity: 0.75;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">Countdown to next test</div>
    <div class="date" id="nextDate">Loading…</div>
    <div class="time" id="countdown">--d --h --m --s</div>
    <div class="small" id="note">Times are in IST (Asia/Kolkata).</div>
  </div>

  <script>
    // 1) EDIT THIS LIST when you have new test dates.
    // Format: "YYYY-MM-DDTHH:MM:SS+05:30"  (the +05:30 forces IST correctly)
    const TEST_DATES = [
      "2026-06-07T09:00:00+05:30",
      "2026-06-28T09:00:00+05:30",
    ];

    function getNextTestDate(now) {
      for (const s of TEST_DATES) {
        const d = new Date(s);
        if (d.getTime() > now.getTime()) return d;
      }
      return null; // no future dates
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function formatIST(d) {
      // Show it nicely in IST
      return new Intl.DateTimeFormat("en-IN", {
        timeZone: "Asia/Kolkata",
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      }).format(d);
    }

    function tick() {
      const now = new Date();
      const next = getNextTestDate(now);

      const nextDateEl = document.getElementById("nextDate");
      const countdownEl = document.getElementById("countdown");
      const noteEl = document.getElementById("note");

      if (!next) {
        nextDateEl.textContent = "No upcoming tests in the list";
        countdownEl.textContent = "Add a new date";
        noteEl.textContent = "Edit TEST_DATES in index.html and add your next test.";
        return;
      }

      nextDateEl.textContent = formatIST(next);

      let diffMs = next.getTime() - now.getTime();
      if (diffMs < 0) diffMs = 0;

      const totalSeconds = Math.floor(diffMs / 1000);
      const days = Math.floor(totalSeconds / (24 * 3600));
      const hours = Math.floor((totalSeconds % (24 * 3600)) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      countdownEl.textContent = `${days}d ${pad2(hours)}h ${pad2(mins)}m ${pad2(secs)}s`;
      noteEl.textContent = "Times are in IST (Asia/Kolkata).";
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
