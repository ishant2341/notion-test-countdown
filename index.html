<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Next Test Countdown</title>

  <style>
    :root{
      --panel: #0b0b0b;        /* main black */
      --tile: #101010;         /* tile black */
      --tile-border: #242424;  /* border */
      --text: #f5f5f5;         /* white-ish */
      --muted: #b9b9b9;        /* muted */
      --accent: #ffffff;       /* brightest white (numbers) */
    }

    body{
      margin:0;
      background: transparent;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
    }

    .wrap{
      display:inline-block;
      background: var(--panel);
      border: 1px solid #111;
      border-radius: 18px;
      padding: 14px 14px 12px;
      min-width: 280px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom: 12px;
    }

    .title{
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .next{
      margin-top: 5px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .pill{
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid #2a2a2a;
      background: #0f0f0f;
      color: #e1e1e1;
      font-size: 11px;
      white-space: nowrap;
      line-height: 1.2;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .tile{
      background: var(--tile);
      border: 2px solid var(--tile-border);
      border-radius: 14px;
      padding: 14px 10px 12px;
      text-align:center;
    }

    .num{
      font-size: 36px;
      line-height: 1;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .unit{
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .footer{
      margin-top: 10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="title">Next test countdown</div>
        <div class="next" id="nextDate">Loading…</div>
      </div>
      <div class="pill">IST • 09:00</div>
    </div>

    <div class="grid">
      <div class="tile">
        <div class="num" id="d">--</div>
        <div class="unit">Days</div>
      </div>
      <div class="tile">
        <div class="num" id="h">--</div>
        <div class="unit">Hours</div>
      </div>
      <div class="tile">
        <div class="num" id="m">--</div>
        <div class="unit">Mins</div>
      </div>
      <div class="tile">
        <div class="num" id="s">--</div>
        <div class="unit">Secs</div>
      </div>
    </div>

    <div class="footer">
      <div id="note">Auto-picks the next date</div>
      <div class="pill" id="whichTest">—</div>
    </div>
  </div>

  <script>
    // ====== EDIT ONLY THIS LIST when you have new tests ======
    // Format must be exactly like this to force IST: "YYYY-MM-DDTHH:MM:SS+05:30"
    const TEST_DATES = [
      "2026-06-07T09:00:00+05:30",
      "2026-06-28T09:00:00+05:30",
    ];
    // ========================================================

    function getNextTestDate(now) {
      for (const s of TEST_DATES) {
        const d = new Date(s);
        if (d.getTime() > now.getTime()) return d;
      }
      return null;
    }

    function formatIST(d) {
      return new Intl.DateTimeFormat("en-IN", {
        timeZone: "Asia/Kolkata",
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      }).format(d);
    }

    function tick() {
      const now = new Date();
      const next = getNextTestDate(now);

      const nextDateEl = document.getElementById("nextDate");
      const noteEl = document.getElementById("note");
      const whichTestEl = document.getElementById("whichTest");

      const dEl = document.getElementById("d");
      const hEl = document.getElementById("h");
      const mEl = document.getElementById("m");
      const sEl = document.getElementById("s");

      if (!next) {
        nextDateEl.textContent = "No upcoming tests in the list";
        noteEl.textContent = "Add a new date in TEST_DATES";
        whichTestEl.textContent = "No dates";
        dEl.textContent = hEl.textContent = mEl.textContent = sEl.textContent = "--";
        return;
      }

      nextDateEl.textContent = formatIST(next);
      whichTestEl.textContent = next.toISOString().slice(0, 10);

      let diffMs = next.getTime() - now.getTime();
      if (diffMs < 0) diffMs = 0;

      const totalSeconds = Math.floor(diffMs / 1000);
      const days = Math.floor(totalSeconds / (24 * 3600));
      const hours = Math.floor((totalSeconds % (24 * 3600)) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      dEl.textContent = String(days);
      hEl.textContent = String(hours).padStart(2, "0");
      mEl.textContent = String(mins).padStart(2, "0");
      sEl.textContent = String(secs).padStart(2, "0");
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
